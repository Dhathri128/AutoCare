{% extends 'base.html' %}
{% block title %}Offers | Admin{% endblock %}
{% block content %}
<div class="container py-5"><h1>Offers</h1><div class="row g-4">
<div class="col-lg-5"><div class="card"><div class="card-body"><h5>Create Offer</h5><form method="post"><input class="form-control mb-2" name="title" placeholder="Title" required><textarea class="form-control mb-2" name="description" placeholder="Description"></textarea><input class="form-control mb-2" type="number" step="0.1" name="discount_percent" placeholder="Discount %"><input class="form-control mb-2" name="code" placeholder="Code"><input class="form-control mb-3" type="date" name="valid_until" required><button class="btn btn-dark w-100">Create</button></form></div></div></div>
<div class="col-lg-7"><table class="table"><thead><tr><th>Offer</th><th>Discount</th><th>Code</th><th>Valid</th></tr></thead><tbody>{% for o in offers %}<tr><td>{{ o.title }}</td><td>{{ o.discount_percent }}%</td><td>{{ o.code }}</td><td>{{ o.valid_until }}</td></tr>{% endfor %}</tbody></table></div>
</div></div>
{% endblock %}

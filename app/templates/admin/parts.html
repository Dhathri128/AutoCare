{% extends 'base.html' %}
{% block title %}Parts | Admin{% endblock %}
{% block content %}
<div class="container py-5"><h1>Spare Parts Inventory</h1><div class="row g-4">
<div class="col-lg-5"><div class="card"><div class="card-body"><h5>Add Part</h5><form method="post"><input class="form-control mb-2" name="name" placeholder="Part name" required><input class="form-control mb-2" name="part_number" placeholder="Part number"><input class="form-control mb-2" type="number" name="stock" placeholder="Stock"><input class="form-control mb-3" type="number" step="0.01" name="price" placeholder="Price"><button class="btn btn-dark w-100">Add Part</button></form></div></div></div>
<div class="col-lg-7"><table class="table"><thead><tr><th>Part</th><th>Part #</th><th>Stock</th><th>Price</th></tr></thead><tbody>{% for p in parts %}<tr><td>{{ p.name }}</td><td>{{ p.part_number }}</td><td>{{ p.stock }}</td><td>₹{{ p.price }}</td></tr>{% endfor %}</tbody></table></div>
</div></div>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Services | Admin{% endblock %}
{% block content %}
<div class="container py-5"><h1>Services & Pricing</h1><div class="row g-4">
<div class="col-lg-5"><div class="card"><div class="card-body"><h5>Add Service</h5><form method="post"><input class="form-control mb-2" name="name" placeholder="Service name" required><textarea class="form-control mb-2" name="description" placeholder="Description"></textarea><input class="form-control mb-2" type="number" step="0.01" name="price" placeholder="Price" required><input class="form-control mb-3" name="estimated_duration" placeholder="Estimated duration"><button class="btn btn-dark w-100">Add Service</button></form></div></div></div>
<div class="col-lg-7"><table class="table"><thead><tr><th>Service</th><th>Price</th><th>Duration</th></tr></thead><tbody>{% for s in services %}<tr><td>{{ s.name }}</td><td>₹{{ s.price }}</td><td>{{ s.estimated_duration }}</td></tr>{% endfor %}</tbody></table></div>
</div></div>
{% endblock %}
